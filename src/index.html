<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FilStock Julok</title>
<link rel="stylesheet" href="styles.css">
</head>
<body data-theme="dark">

<!-- defs partagés du wordmark imprimé : dégradés de la goutte + contour bosselé par couche -->
<svg width="0" height="0" aria-hidden="true" style="position:absolute"><defs>
  <linearGradient id="dropGHdr" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f0b48a" /><stop offset="0.55" stop-color="#cd6f47" /><stop offset="1" stop-color="#9c4a28" />
  </linearGradient>
  <linearGradient id="dropGLHdr" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#c15f3c" /><stop offset="0.6" stop-color="#a84e30" /><stop offset="1" stop-color="#8a3d22" />
  </linearGradient>
  <filter id="layerBumpHdr" x="-9%" y="-5%" width="118%" height="110%" color-interpolation-filters="sRGB">
    <feTurbulence type="turbulence" baseFrequency="0.0018 0.278" numOctaves="1" seed="7" stitchTiles="stitch" result="noise" />
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.3" xChannelSelector="R" yChannelSelector="B" />
  </filter>
</defs></svg>

<header>
  <div class="logo">
    <span class="brandmark" aria-label="FilStock">
      <span class="pword">
        <span class="pfill" aria-hidden="true">FilSt</span>
        <svg class="drop" viewBox="0 0 86 150" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path class="base" d="M 43 6 C 60 52, 82 74, 82 104 a 39 39 0 1 1 -78 0 C 4 74, 26 52, 43 6 Z" fill="url(#dropGHdr)" />
        </svg>
        <span class="pfill" aria-hidden="true">ck</span>
      </span>
    </span>
    <span class="logo-sub">Julok</span>
    <span class="version-badge" id="versionBadge"></span>
    <span class="last-modified-badge" id="lastModifiedBadge" title="Voir le journal des modifications" style="display:none"></span>
  </div>
  <div class="header-actions">
    <button class="btn-icon" id="themeBtn" title="Thème"></button>
    <button class="btn-icon" id="viewBtn" title="Changer de vue"></button>
    <button class="btn-icon" id="exportBtn" title="Exporter en JSON">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    </button>
    <button class="btn-icon" id="importBtn" title="Importer un JSON">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
    </button>
    <button class="btn-icon" id="journalBtn" title="Journal des modifications">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
    </button>
    <button class="btn-icon" id="settingsBtn" title="Réglages">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
    <input type="file" id="importFile" accept=".json" style="display:none">
    <button class="btn-add" id="addBtn">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Bobine
    </button>
  </div>
</header>

<div class="filters">
  <button class="filter-chip active" data-filter="all">Tout</button>
  <button class="filter-chip" data-filter="open">Ouvertes</button>
  <button class="filter-chip" data-filter="vacuum">Sous vide</button>
  <button class="filter-chip" data-filter="inuse">En machine</button>
  <button class="filter-chip" data-filter="stock">En stock</button>
  <button class="filter-chip" data-filter="alert">⚠ Presque vides</button>
  <div class="filter-sep"></div>
  <div class="search-wrap">
    <input type="search" id="searchInput" placeholder="Rechercher…" autocomplete="off">
    <button class="search-clear" id="searchClearBtn" title="Effacer">✕</button>
  </div>
</div>

<div class="sort-bar" id="sortBar">
  <span class="sort-label">Grouper :</span>
  <button class="filter-chip active" data-group="material+color">Mat.+Couleur</button>
  <button class="filter-chip" data-group="material">Matière</button>
  <button class="filter-chip" data-group="color">Couleur</button>
  <div class="filter-sep"></div>
  <span class="sort-label">Trier :</span>
  <button class="filter-chip active" data-sort="default">Défaut</button>
  <button class="filter-chip" data-sort="brand">Marque</button>
  <button class="filter-chip" data-sort="qty-asc">Qté ↑</button>
  <button class="filter-chip" data-sort="qty-desc">Qté ↓</button>
  <button class="filter-chip" data-sort="date">Créé</button>
  <button class="filter-chip" data-sort="modified">Modifié</button>
</div>

<div class="stats" id="statsBar"></div>
<div class="view-container" id="viewContainer"></div>

<!-- MODAL BOBINE -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-title" id="modalTitle">Nouvelle bobine</div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">MARQUE</label>
        <input class="form-input" id="fBrand" placeholder="Bambu" value="Bambu" list="brandList">
        <datalist id="brandList"></datalist>
      </div>
      <div class="form-group">
        <label class="form-label">MATIÈRE</label>
        <select class="form-select" id="fMaterial"></select>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">COULEUR</label>
      <div class="color-row" id="colorRow"></div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">POIDS DE LA BOBINE</label>
        <select class="form-select" id="fWeight"></select>
      </div>
      <div class="form-group">
        <label class="form-label">QUANTITÉ RESTANTE</label>
        <div class="qty-slider-wrap">
          <button class="btn-qty" id="qtyMinusBtn" type="button" title="−10 %">−10</button>
          <input type="range" id="fQty" min="0" max="100" value="100">
          <button class="btn-qty" id="qtyPlusBtn" type="button" title="+10 %">+10</button>
        </div>
        <div class="qty-display" id="qtyDisplay" style="margin-top:6px">1000g · 100%</div>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">EMBALLAGE</label>
      <div class="form-toggle-row">
        <button class="form-toggle active" data-group="pack" data-val="vacuum">🔒 Sous vide</button>
        <button class="form-toggle" data-group="pack" data-val="open">📦 Ouvert</button>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">EMPLACEMENT</label>
      <div class="form-toggle-row">
        <button class="form-toggle active" data-group="loc" data-val="stock">📦 En stock</button>
        <button class="form-toggle" data-group="loc" data-val="inuse">🖨 En machine</button>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">TYPE</label>
      <div class="form-toggle-row">
        <button class="form-toggle active" data-group="type" data-val="mounted">🔩 Montée sur support</button>
        <button class="form-toggle" data-group="type" data-val="refill">♻ Recharge</button>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">SUPPORT DE BOBINE</label>
      <select class="form-select" id="fSupport">
        <option value="">— Aucun support —</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">CARACTÉRISTIQUES SPÉCIALES</label>
      <div class="traits-grid" id="traitsGrid"></div>
    </div>
    <div class="form-group">
      <label class="form-label">NOTES (optionnel)</label>
      <input class="form-input" id="fNotes" placeholder="Commentaire libre…">
    </div>
    <div class="modal-footer">
      <button class="btn-delete" id="deleteBtn" style="display:none">🗑 Supprimer</button>
      <button class="btn-cancel" id="duplicateBtn" style="display:none" title="Crée une copie avec 100% de quantité">⧉ Dupliquer</button>
      <button class="btn-cancel" id="cancelModalBtn">Annuler</button>
      <button class="btn-save" id="saveSpoolBtn">Enregistrer</button>
    </div>
  </div>
</div>

<!-- SETTINGS PANEL -->
<div class="settings-overlay" id="settingsOverlay">
  <div class="settings-panel">
    <div class="settings-header">
      <div class="settings-title">⚙ Réglages</div>
      <button class="settings-close" id="settingsCloseBtn">✕</button>
    </div>
    <div class="settings-body">

      <!-- APPARENCE -->
      <div>
        <div class="settings-section-title">Apparence</div>
        <div class="settings-row"><label>Taille de police globale</label><span class="val" id="valFontSize">100%</span></div>
        <input type="range" class="settings-slider" id="slFontSize" min="75" max="130" value="100" step="5">
        <div class="settings-row" style="margin-top:14px"><label>Texte dans les pastilles</label><span class="val" id="valPastille">100%</span></div>
        <input type="range" class="settings-slider" id="slPastille" min="50" max="200" value="100" step="10">
        <div class="settings-row" style="margin-top:14px"><label>Taille boutons &amp; icônes</label><span class="val" id="valBtnSize">100%</span></div>
        <input type="range" class="settings-slider" id="slBtnSize" min="70" max="150" value="100" step="5">
      </div>

      <!-- SUPPORTS DE BOBINE -->
      <div>
        <div class="settings-section-title">Supports de bobine</div>
        <div class="custom-list" id="supportList"></div>
        <div class="add-row" style="margin-bottom:8px">
          <select id="newSupportType">
            <option value="normal">🔩 Normal (~60°C, PLA)</option>
            <option value="high-temp">🌡️ Haute temp. (~90°C, PETG/ABS)</option>
            <option value="very-high-temp">🔥 Très haute temp. (&gt;90°C, PA-CF)</option>
          </select>
        </div>
        <div class="add-row">
          <input type="text" id="newSupportNotes" placeholder="Notes optionnelles…" maxlength="30">
          <button class="btn-add-small" id="addSupportBtn">＋ Ajouter</button>
        </div>
        <div style="font-size:11px;color:var(--text2);margin-top:8px;display:flex;align-items:center;gap:6px">
          Prochain ID : <span class="val" id="supportIdPreview">—</span>
        </div>
      </div>

      <!-- MATIÈRES -->
      <div>
        <div class="settings-section-title">Matières personnalisées</div>
        <div class="custom-list" id="materialList"></div>
        <div class="add-row">
          <input type="text" id="newMaterial" placeholder="Ex: SILK, CLAY…" maxlength="12">
          <button class="btn-add-small" id="addMaterialBtn">＋ Ajouter</button>
        </div>
      </div>

      <!-- COULEURS -->
      <div>
        <div class="settings-section-title">Couleurs personnalisées</div>
        <div class="custom-list" id="colorList"></div>
        <div class="add-row">
          <input type="color" id="newColorHex" value="#ff0000">
          <input type="text" id="newColorName" placeholder="Nom de la couleur" maxlength="16">
          <button class="btn-add-small" id="addColorBtn">＋</button>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- JOURNAL PANEL -->
<div class="settings-overlay" id="journalOverlay">
  <div class="settings-panel">
    <div class="settings-header">
      <div class="settings-title">📋 Journal</div>
      <button class="settings-close" id="journalCloseBtn">✕</button>
    </div>
    <div class="journal-tabs" id="journalTabs">
      <button class="journal-tab active" data-jfilter="all">Tout</button>
      <button class="journal-tab" data-jfilter="spool">🧵 Bobines</button>
      <button class="journal-tab" data-jfilter="support">🔩 Supports</button>
      <button class="journal-tab-clear" id="clearJournalBtn">🗑 Effacer</button>
    </div>
    <div class="settings-body" id="journalEntries" style="padding-top:12px;gap:5px"></div>
  </div>
</div>

<!-- DIALOGUE DE CONFIRMATION (confirm() natif non supporté par la WebView) -->
<div class="overlay" id="confirmOverlay">
  <div class="modal modal-confirm">
    <div class="confirm-msg" id="confirmMsg"></div>
    <div class="modal-footer" id="confirmButtons"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
