name: filstock
description: "FilStock — gestion d'inventaire de bobines de filament 3D (app native)."
publish_to: 'none'

# Version affichée dans l'app + versionName Android / CFBundleShortVersionString iOS.
version: 3.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Gestion d'état simple et idiomatique
  provider: ^6.1.2
  # Répertoire de données applicatif (filstock_data.json)
  path_provider: ^2.1.5
  # Import : sélection d'un fichier JSON
  file_picker: ^8.1.6
  # Export : partage du fichier JSON (share sheet Android / iOS)
  share_plus: ^10.1.3
  # Formatage de dates localisé
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
