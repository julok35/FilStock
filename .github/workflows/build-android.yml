name: Build app (Flutter)

on:
  push:
    branches: [main, native-app, "claude/**"]
  workflow_dispatch: # déclenchement manuel depuis l'onglet Actions de GitHub

# Variables partagées par tous les jobs
env:
  FLUTTER_VERSION: "3.27.1"
  # Exécute les actions JS (checkout/setup-java/upload-artifact) sur Node.js 24.
  # Évite l'avertissement de dépréciation de Node.js 20 (forcé dès le 16/06/2026).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ── Analyse statique + tests (rapide, sur Linux) ──────────────────────
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  # ── Build APK Android ────────────────────────────────────────────────
  build-android:
    needs: analyze
    runs-on: ubuntu-latest
    permissions:
      contents: write # nécessaire pour publier l'APK dans une release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # APK release signé avec la clé debug (installable directement pour tester).
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: filstock-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
      # Publie l'APK dans une release « rolling » → lien direct, installable
      # depuis le téléphone : .../releases/download/android-latest/app-release.apk
      - name: Publier l'APK (release android-latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: FilStock — dernier APK Android (test)
          body: |
            APK de test construit automatiquement par la CI.
            Signé avec la clé debug — autoriser « sources inconnues » à l'installation.
          files: build/app/outputs/flutter-apk/app-release.apk
          make_latest: true

  # ── Build iOS (sans signature) — vérifie la compatibilité Apple ───────
  build-ios:
    needs: analyze
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # --no-codesign : build de validation, pas de certificat Apple requis.
      - run: flutter build ios --release --no-codesign
