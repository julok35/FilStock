name: Build app (Flutter)

on:
  push:
    branches: [main, native-app, "claude/**"]
  workflow_dispatch: # déclenchement manuel depuis l'onglet Actions de GitHub

# Version de Flutter unique pour tous les jobs
env:
  FLUTTER_VERSION: "3.27.1"

jobs:
  # ── Analyse statique + tests (rapide, sur Linux) ──────────────────────
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  # ── Build APK Android ────────────────────────────────────────────────
  build-android:
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # APK release signé avec la clé debug (installable directement pour tester).
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: filstock-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  # ── Build iOS (sans signature) — vérifie la compatibilité Apple ───────
  build-ios:
    needs: analyze
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # --no-codesign : build de validation, pas de certificat Apple requis.
      - run: flutter build ios --release --no-codesign
