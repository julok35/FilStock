name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch: # déclenchement manuel depuis l'onglet Actions de GitHub

jobs:
  # Tests (logique métier + smoke test jsdom) — bloque le build APK si rouge
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install npm dependencies
        run: npm ci --no-audit --no-fund

      - name: Run tests
        run: npm test

  build-android:
    needs: test
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;27.0.12077973"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> $GITHUB_ENV

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install npm dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Tauri icons
        run: |
          # Crée une image source 512x512 valide via Python (pas de dépendance externe)
          python3 - <<'PYEOF'
          import struct, zlib, os

          def make_png(w, h, r=33, g=150, b=243):
              def chunk(tag, data):
                  crc = zlib.crc32(tag + data) & 0xFFFFFFFF
                  return struct.pack('>I', len(data)) + tag + data + struct.pack('>I', crc)
              raw = b''.join(b'\x00' + bytes([r, g, b] * w) for _ in range(h))
              return (b'\x89PNG\r\n\x1a\n'
                      + chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0))
                      + chunk(b'IDAT', zlib.compress(raw, 9))
                      + chunk(b'IEND', b''))

          os.makedirs('src-tauri/icons', exist_ok=True)
          with open('app-icon.png', 'wb') as f:
              f.write(make_png(512, 512))
          print('Source icon app-icon.png created (512x512)')
          PYEOF

          # Génère tous les formats d'icônes requis par Tauri (desktop + Android)
          npx tauri icon app-icon.png

      # gen/android est commité dans le repo ; init uniquement s'il manque
      - name: Initialize Tauri Android project (si absent)
        run: test -d src-tauri/gen/android || npx tauri android init
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}

      - name: Build Android APK (debug)
        run: npx tauri android build --apk --debug
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
          CARGO_INCREMENTAL: "0"

      # Signature : utilise le keystore persistant du secret ANDROID_KEYSTORE_BASE64
      # s'il existe (signature stable → les mises à jour s'installent par-dessus
      # l'ancienne version sans désinstaller). Sinon, keystore éphémère.
      #
      # Pour créer le secret (une seule fois, sur votre machine) :
      #   keytool -genkeypair -keystore filstock.keystore -alias androiddebugkey \
      #     -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android \
      #     -dname "CN=FilStock,O=Julok,C=FR" -noprompt
      #   base64 -w0 filstock.keystore   → coller le résultat dans
      #   Settings → Secrets and variables → Actions → ANDROID_KEYSTORE_BASE64
      - name: Sign APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "Keystore persistant fourni via secret — signature stable"
            echo "$KEYSTORE_B64" | base64 -d > debug.keystore
          else
            echo "::warning::Pas de secret ANDROID_KEYSTORE_BASE64 — keystore éphémère :"
            echo "::warning::chaque APK aura une signature différente (désinstallation requise pour mettre à jour)."
            keytool -genkeypair \
              -keystore debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -noprompt
          fi

          # Trouver tous les APK produits
          APK_DIR="src-tauri/gen/android/app/build/outputs/apk"
          echo "=== APK trouvés avant signature ==="
          find "$APK_DIR" -name "*.apk" | sort

          # Signer chaque APK avec apksigner
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/$(ls $ANDROID_SDK_ROOT/build-tools | sort -V | tail -1)/apksigner"
          echo "apksigner : $APKSIGNER"

          find "$APK_DIR" -name "*.apk" | while read APK; do
            SIGNED="${APK%.apk}-signed.apk"
            "$APKSIGNER" sign \
              --ks debug.keystore \
              --ks-key-alias androiddebugkey \
              --ks-pass pass:android \
              --key-pass pass:android \
              --out "$SIGNED" \
              "$APK"
            echo "Signé : $SIGNED"
          done

          echo "=== APK signés ==="
          find "$APK_DIR" -name "*-signed.apk" | sort

      - name: Upload APK signé
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: filstock-android-debug-signed
          path: src-tauri/gen/android/app/build/outputs/apk/**/*-signed.apk
          retention-days: 14
